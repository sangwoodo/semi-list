<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>반도체 영업대상 정보</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#1d2330; --sub:#5d6677; --line:#e3e6ec; --soft:#f0f2f6;
  --accent:#1f3864; --accent2:#2f5bd3; --t1:#c0392b; --t2:#2e7d4f; --t3:#7a8193;
  --ok:#1e8e3e; --no:#c5221f; --warn:#b26a00; --warnbg:#fff4e0; --redbg:#fde8e8; --greybg:#eceff3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171d; --panel:#1c2028; --ink:#e7eaf0; --sub:#9aa3b5; --line:#2c323d; --soft:#232833;
    --accent:#9db7ff; --accent2:#7fa0ff; --t1:#ff7b6b; --t2:#6fcf97; --t3:#9aa3b5;
    --ok:#6fcf97; --no:#ff7b6b; --warn:#ffb74d; --warnbg:#3a2e17; --redbg:#3b2124; --greybg:#262b35;
  }
}
:root[data-theme="dark"]{
  --bg:#14171d; --panel:#1c2028; --ink:#e7eaf0; --sub:#9aa3b5; --line:#2c323d; --soft:#232833;
  --accent:#9db7ff; --accent2:#7fa0ff; --t1:#ff7b6b; --t2:#6fcf97; --t3:#9aa3b5;
  --ok:#6fcf97; --no:#ff7b6b; --warn:#ffb74d; --warnbg:#3a2e17; --redbg:#3b2124; --greybg:#262b35;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
a{color:var(--accent2);text-decoration:none} a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.side-h h1{font-size:15px;margin:0 0 8px}
.side-h input,.side-h select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--ink);font:inherit}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.count{font-size:12px;color:var(--sub);margin-top:6px}
.list{overflow:auto;flex:1}
.item{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.item:hover{background:var(--soft)} .item.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent2)}
.item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pd{grid-column:2/4;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}
.item .op{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.tb{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;color:#fff}
.tb.t1{background:var(--t1)} .tb.t2{background:var(--t2)} .tb.t3{background:var(--t3)}
.tb.tS{background:#C8891B} .tb.tA{background:#2C6FB5} .tb.tB{background:#548235}
.item .op{font-weight:600}
main{overflow:auto;padding:22px 28px 60px}
.card{max-width:1080px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.top h2{font-size:24px;margin:0}
.badge{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);background:var(--soft);color:var(--sub)}
.badge.red{background:var(--redbg);color:var(--no);border-color:transparent;font-weight:700}
.badge.warn{background:var(--warnbg);color:var(--warn);border-color:transparent;font-weight:700}
.badge.grey{background:var(--greybg)}
.meta{color:var(--sub);font-size:13px;margin:6px 0 4px}
.links{display:flex;gap:14px;font-size:13px;margin-bottom:14px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0 18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--sub)} .kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums} .kpi .s{font-size:12px;color:var(--sub)}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
section h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
section h3 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--panel);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:6px 12px}
dt{color:var(--sub);font-size:13px} dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12.5px}
.muted{color:var(--sub)} .small{font-size:12.5px}
.empty{color:var(--sub);font-style:italic}
.callout{background:var(--soft);border-left:3px solid var(--accent2);padding:8px 12px;border-radius:6px;margin:8px 0}
.callout.hot{border-left-color:var(--no);background:var(--redbg)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .d{color:var(--sub);font-variant-numeric:tabular-nums;font-size:13px}
.tl .t{font-weight:600}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:13.5px}
th:first-child,td:first-child{text-align:left;color:var(--sub);font-weight:500}
thead th{color:var(--sub);font-weight:600;font-size:12.5px}
tr.em td{font-weight:700} td.neg{color:var(--no)}
.chk{list-style:none;margin:0;padding:0}
.chk li{padding:4px 0} .chk .y{color:var(--ok);font-weight:700} .chk .x{color:var(--no);font-weight:700}
svg text{fill:var(--sub);font-size:11px}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font:inherit;padding:8px}
.src{font-size:12px;color:var(--sub);word-break:break-all}
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto} aside{max-height:45vh}
  main{padding:16px} .kpis{grid-template-columns:repeat(3,1fr)} .grid2{grid-template-columns:1fr}
}
</style>
</head>

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => v == null ? "–" : Math.round(v).toLocaleString("ko-KR");
const pct = v => v == null || !isFinite(v) ? "–" : (v*100).toFixed(1) + "%";
// 과거 추진 후 중단된 곳은 신호(★)로 표시하지 않음(2026.11.17)
const ipoSig = d => { const s = d.news && d.news["IPO신호"]; return (s && s !== "확인 안 됨" && !s.includes("중단")) ? s : ""; };
const store = { get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let view = [], cur = 0;

function render(){
  const q = $("#q").value.trim().toLowerCase(), t = $("#fTier").value, st = $("#fStaff").value, ip = $("#fIpo").value, so = $("#fSort").value;
  view = DATA.filter(d => (!t || d.code[0] === t) && (!st || d.staff === st) && (!ip || ipoSig(d)) &&
    (!q || (d.name + " " + d.product + " " + ((d.prof["제품군"]||[]).join(" "))).toLowerCase().includes(q)));
  const k = {op: d => -d.fin.op[2], rev: d => -d.fin.rev[2], gr: d => -d.growth}[so];
  if (k) view.sort((a,b) => k(a) - k(b));
  $("#cnt").textContent = `${view.length} / ${DATA.length}개사`;
  $("#list").innerHTML = view.map((d,i) => `<div class="item${i===cur?" on":""}" data-i="${i}">
    <span class="tb t${d.code[0]}">${esc(d.code)}</span><span class="nm">${esc(d.name)}${ipoSig(d)?" ★":""}</span>
    <span class="op">${esc(d.staff)}</span><span class="pd">${esc(d.field)} · 영업이익 ${fmt(d.fin.op[2])}억</span></div>`).join("");
  if (cur >= view.length) cur = 0;
  show();
}
function bars(d){
  const yrs = ["23","24","25"], rv = d.fin.rev, op = d.fin.op;
  const mx = Math.max(1, ...rv.filter(x=>x!=null), ...op.filter(x=>x!=null));
  const W=300, Hh=120, bw=26, gap=100;
  let s = `<svg viewBox="0 0 ${W} ${Hh+28}" width="100%" style="max-width:340px" role="img" aria-label="매출·영업이익 추이">`;
  yrs.forEach((y,i) => {
    const x = 30 + i*gap, r = rv[i], o = op[i];
    if (r!=null){ const h = r/mx*Hh; s += `<rect x="${x}" y="${Hh-h+4}" width="${bw}" height="${h}" rx="3" fill="var(--accent2)" opacity=".85"><title>매출 ${fmt(r)}억</title></rect>`; }
    if (o!=null){ const h = Math.abs(o)/mx*Hh; s += `<rect x="${x+bw+3}" y="${o>=0?Hh-h+4:Hh+4}" width="${bw}" height="${h}" rx="3" fill="${o>=0?"var(--t2)":"var(--no)"}"><title>영업이익 ${fmt(o)}억</title></rect>`; }
    s += `<text x="${x+bw}" y="${Hh+22}" text-anchor="middle">FY${y}</text>`;
  });
  return s + `</svg><div class="small muted"><span style="color:var(--accent2)">■</span> 매출 &nbsp;<span style="color:var(--t2)">■</span> 영업이익 (억원)</div>`;
}
function show(){
  const d = view[cur]; if (!d){ $("#card").innerHTML = '<p class="empty">조건에 맞는 회사가 없습니다.</p>'; return; }
  document.querySelectorAll(".item").forEach((e,i) => e.classList.toggle("on", i===cur));
  const f = d.fin, p = d.prof || {}, n = d.news || {};
  const opm = i => f.rev[i] && f.op[i]!=null ? f.op[i]/f.rev[i] : null;
  const debt = i => f.eq[i] ? f.liab[i]/f.eq[i] : null;
  const ni = f.ni[2];
  const capLo = ni>0 ? ni*10 : null, capHi = ni>0 ? ni*15 : null;
  const sig = ipoSig(d);
  const row = (lab, arr, fn=fmt, em=false) => `<tr class="${em?"em":""}"><td>${lab}</td>${arr.map(v=>`<td class="${typeof v==="number"&&v<0?"neg":""}">${fn(v)}</td>`).join("")}</tr>`;
  const est = d.est ? `${d.est.slice(0,4)}.${d.est.slice(4,6)}` : "";
  const news = p["뉴스"] || [];
  $("#card").innerHTML = `
  <div class="top"><h2>${esc(d.name)}</h2>
    <span class="tb t${d.code[0]}" style="font-size:12.5px;padding:3px 9px">${esc(d.code)} · ${esc({S:"영업이익 200억↑",A:"영업이익 100~200억",B:"영업이익 100억 미만"}[d.code[0]])}</span>
    <span class="badge" style="font-weight:700">담당 ${esc(d.staff)}</span>
    <span class="badge">${esc(d.field)}</span>
    ${sig?`<span class="badge red">★ ${esc(sig)}</span>`:""}
    <span class="badge">투자: ${esc(d.inv[0])}</span>
  </div>
  <div class="callout" style="white-space:pre-line;font-size:14px;margin:10px 0 6px">${esc(d.summary)}</div>
  <div class="meta">${esc(d.product)}</div>
  <div class="meta small">대표 ${esc(d.ceo)} · 설립 ${est} · ${esc(d.addr)} · ☎ ${esc(d.tel||"-")} · KSIC ${esc(d.ksic)}</div>
  <div class="links">
    ${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">🌐 홈페이지</a>`:'<span class="muted">홈페이지 없음</span>'}
    <a href="${d.dart}" target="_blank" rel="noopener">📄 DART 감사보고서(FY25)</a>
    <a href="https://search.naver.com/search.naver?where=news&sort=1&query=${encodeURIComponent('"'+d.name+'"')}" target="_blank" rel="noopener">📰 네이버 뉴스</a>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">매출 FY25</div><div class="v">${fmt(f.rev[2])}</div><div class="s">YoY ${d.growth}%</div></div>
    <div class="kpi"><div class="l">영업이익</div><div class="v">${fmt(f.op[2])}</div><div class="s">이익률 ${pct(opm(2))}</div></div>
    <div class="kpi"><div class="l">순이익</div><div class="v">${fmt(ni)}</div><div class="s">세전 ${fmt(f.pbt[2])}</div></div>
    <div class="kpi"><div class="l">자기자본</div><div class="v">${fmt(f.eq[2])}</div><div class="s">부채비율 ${pct(debt(2))}</div></div>
    <div class="kpi"><div class="l">현금</div><div class="v">${fmt(f.cash[2])}</div><div class="s">자산 ${fmt(f.asset[2])}</div></div>
    <div class="kpi"><div class="l">실적 추세</div><div class="v" style="font-size:14px;padding-top:4px">${esc(d.trend)}</div><div class="s">단위 억원</div></div>
  </div>

  <section><h3><span class="n">1</span>사업 — 웹사이트 기준 ${p["정보수준"]?`<span class="badge">정보 ${esc(p["정보수준"])}</span>`:""}</h3>
    ${p["사업개요"]?`<p style="margin:0 0 10px">${esc(p["사업개요"])}</p>`:'<p class="empty">웹 조사 결과 없음</p>'}
    ${(p["제품군"]||[]).length?`<div class="chips" style="margin-bottom:12px">${p["제품군"].map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:""}
    <dl>
      <dt>공정·분야</dt><dd>${esc(d.verify.process)||"–"}</dd>
      <dt>고객·파트너</dt><dd>${esc(p["고객·파트너"]||d.verify.customer)||"–"}</dd>
      <dt>기술·인증</dt><dd>${esc(p["기술·인증"])||"–"}</dd>
      <dt>사업장·인력</dt><dd>${esc(p["사업장·인력"])||"–"}</dd>
      <dt>연혁</dt><dd>${esc(p["연혁"])||"–"}</dd>
      <dt>사업 방향</dt><dd>${esc(p["사업방향"])||"–"}</dd>
    </dl>
  </section>

  <section><h3><span class="n">2</span>뉴스 · 동향</h3>
    <div class="callout ${sig?"hot":""}"><b>IPO·투자 신호:</b> ${esc(n["IPO신호"]||"조사 전")} — ${esc(n["요약"]||"")}
      ${n["투자"]?`<div class="small"><b>투자</b> ${esc(n["투자"])}</div>`:""}
      ${n["지배구조변동"]?`<div class="small"><b>지배구조</b> ${esc(n["지배구조변동"])}</div>`:""}
    </div>
    ${news.length?`<ul class="tl">${news.map(x=>`<li><span class="d">${esc(x.date)}</span><div><div class="t">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)}</div><div class="small muted">${esc(x.summary)}</div></div></li>`).join("")}</ul>`:'<p class="empty">확인된 관련 기사 없음</p>'}
  </section>

  <section><h3><span class="n">3</span>재무 · IPO 검토</h3>
    <div class="grid2">
      <div><table><thead><tr><th>(억원)</th><th>FY23</th><th>FY24</th><th>FY25</th></tr></thead><tbody>
        ${row("매출", f.rev, fmt, true)}${row("영업이익", f.op, fmt, true)}${row("영업이익률", [0,1,2].map(opm), pct)}
        ${row("순이익", f.ni)}${row("세전이익", f.pbt)}${row("자산총계", f.asset)}${row("부채총계", f.liab)}
        ${row("자본총계", f.eq)}${row("부채비율", [0,1,2].map(debt), pct)}${row("현금성자산", f.cash)}${row("연구개발비", f.rnd)}
      </tbody></table>
      <div class="small muted" style="margin-top:6px">FY23은 FY24 감사보고서 기준. 재무상태표는 FY25 보고서의 당기·전기만 추출</div></div>
      <div>${bars(d)}
        <h4 style="margin:14px 0 6px;font-size:13.5px">코스닥 일반상장 이익요건 (FY25 단순 체크)</h4>
        <ul class="chk">${d.req.map(([l,ok])=>`<li><span class="${ok?"y":"x"}">${ok?"✓":"✗"}</span> ${esc(l)}</li>`).join("")||'<li class="empty">세전이익 추출 실패</li>'}</ul>
        <div class="callout small">참고 시가총액(순이익 × PER 10~15배, 단순 계산): <b>${capLo?fmt(capLo)+" ~ "+fmt(capHi)+"억":"–"}</b><br>
          <span class="muted">실제 밸류는 피어 PER·성장성·고객 집중도에 따라 크게 달라짐</span></div>
      </div>
    </div>
    <dl style="margin-top:12px">
      ${d.review && d.review["판단"]?`<dt>검토 의견</dt><dd><b>${esc(d.review["판단"])}</b> — ${esc(d.review["의견"])}</dd><dt>접촉 전 확인</dt><dd>${esc(d.review["확인"])}</dd>`:""}
      <dt>사업 관점</dt><dd>${esc(p["IPO관점"])||"–"}</dd>
      <dt>주주·투자</dt><dd>${esc(d.inv[0])} — <span class="muted">${esc(d.inv[1])}</span></dd>
      <dt>비고</dt><dd>${esc(d.note)||"–"}</dd>
    </dl>
  </section>

  <section><h3>📝 내 메모 <span class="muted small">(이 PC 브라우저에만 저장)</span></h3>
    <textarea id="memo" placeholder="접촉 내용, 확인할 것 등">${esc(store.get("memo:"+d.name))}</textarea>
  </section>
  <p class="src">출처: DART 감사보고서 · 금투협 대표주관계약 · 홈페이지/뉴스 웹조사 — 제품검증 근거: ${esc(d.verify.src)}</p>`;
  $("#memo").addEventListener("input", e => store.set("memo:"+d.name, e.target.value));
  $("main").scrollTop = 0;
}
$("#list").addEventListener("click", e => { const it = e.target.closest(".item"); if (it){ cur = +it.dataset.i; show(); } });
[...new Set(DATA.map(d => d.staff))].forEach(s => { const o = document.createElement("option"); o.textContent = s; $("#fStaff").appendChild(o); });
["#q","#fTier","#fStaff","#fIpo","#fSort"].forEach(s => $(s).addEventListener("input", () => { cur = 0; render(); }));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); cur = Math.max(0, Math.min(view.length-1, cur + (e.key==="ArrowDown"?1:-1))); show();
    document.querySelector(".item.on")?.scrollIntoView({block:"nearest"}); }
});
render();
</script>
</body>
</html>
